name: library_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=2.18.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.0.0+4
  path_provider: ^2.0.8
  path: ^1.8.0
  provider: ^6.1.2
  file_picker: ^5.0.0
  audioplayers: ^6.1.0
  email_validator: ^3.0.0
  shared_preferences: ^2.1.1
  firebase_storage: ^11.0.0
  firebase_core: ^2.18.0
  firebase_auth: ^4.14.0
  cloud_firestore: ^4.6.0
  just_audio: ^0.9.30
  permission_handler: ^10.0.0
  flutter_native_splash: ^2.2.10
  flutter_svg: ^2.0.9
  flip_card: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
    - assets/POST.gif

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/LOGO.png"
  remove_alpha_ios: true

flutter_native_splash:
  image: assets/POST.gif # Can replace with a static PNG for native splash
  color: "#ffffff"       # Background color

